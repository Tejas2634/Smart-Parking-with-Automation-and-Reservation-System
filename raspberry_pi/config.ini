[SERVER]
# Replace with the IP/Hostname of the backend server (e.g., http://192.168.1.100:8000)
api_url = http://127.0.0.1:8000/api/anpr/gate-trigger
parking_lot_id = 1
gate_type = entry

[CAMERA]
# Options: picam2, opencv, test_mock
capture_backend = opencv
camera_index = 0
# Low memory resolution for Raspberry Pi 4B 1GB RAM (1280x720 or 640x480 recommended)
frame_width = 1280
frame_height = 720
fps = 15

[ANPR]
# Options: local_tesseract, server_cloud
ocr_mode = server_cloud
detection_interval_sec = 1.5
min_plate_confidence = 0.85

[GPIO]
# Raspberry Pi 4B GPIO Pin assignments (BCM mode)
enabled = false
servo_barrier_pin = 18
green_led_pin = 23
red_led_pin = 24
buzzer_pin = 25
barrier_open_duration_sec = 5.0
